version: "3.8"

services:
  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: mall-go-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: mall_go
      MYSQL_USER: mall_user
      MYSQL_PASSWORD: mall_password
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - mall-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: mall-go-redis
    restart: unless-stopped
    command: redis-server --requirepass redis123456 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mall-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # GoMall应用服务
  mall-go:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mall-go-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: dev
      SERVER_PORT: 8081
      SERVER_MODE: debug

      # 数据库配置 - 支持MySQL和SQLite双驱动
      # 使用MySQL: DB_DRIVER=mysql
      # 使用SQLite: DB_DRIVER=sqlite
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: mall_user
      DB_PASSWORD: mall_password
      DB_NAME: mall_go
      DB_CHARSET: utf8mb4
      DB_MAX_IDLE_CONNS: 10
      DB_MAX_OPEN_CONNS: 100
      DB_CONN_MAX_LIFETIME: 3600

      # Redis配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123456
      REDIS_DB: 0
      REDIS_POOL_SIZE: 200
      REDIS_MIN_IDLE_CONNS: 20
      REDIS_MAX_RETRIES: 5
      REDIS_DIAL_TIMEOUT: 10
      REDIS_READ_TIMEOUT: 5
      REDIS_WRITE_TIMEOUT: 5
      REDIS_IDLE_TIMEOUT: 600
      REDIS_MAX_CONN_AGE: 7200

      # JWT配置
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_EXPIRE: 24h

      # 日志配置
      LOG_LEVEL: info
      LOG_FORMAT: json
      LOG_OUTPUT: stdout

      # CORS配置
      CORS_ALLOW_ORIGINS: "http://localhost:3000,http://localhost:8080"
      CORS_ALLOW_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
      CORS_ALLOW_HEADERS: "Content-Type,Authorization"
    ports:
      - "8081:8081"
    volumes:
      # SQLite数据库文件持久化
      - sqlite_data:/app/data
    networks:
      - mall-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8081/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# 网络定义
networks:
  mall-network:
    driver: bridge

# 数据卷定义
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  sqlite_data:
    driver: local
