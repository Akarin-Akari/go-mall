# 生产环境配置文件
# 敏感信息通过环境变量注入，不要在此文件中硬编码

server:
  port: 8081
  mode: release  # Gin 生产模式

# 数据库配置
database:
  driver: mysql
  host: localhost
  port: 3306
  username: root
  password: ""  # 通过环境变量 DB_PASSWORD 注入
  dbname: mall
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 50
  conn_max_lifetime: 1800  # 30分钟

# Redis配置
redis:
  host: localhost
  port: 6379
  password: ""  # 通过环境变量 REDIS_PASSWORD 注入
  db: 0
  # 连接池配置 - 生产环境优化
  pool_size: 100          # 连接池大小
  min_idle_conns: 10      # 最小空闲连接数
  max_retries: 3          # 最大重试次数
  # 超时配置
  dial_timeout: 5         # 连接超时(秒)
  read_timeout: 3         # 读取超时(秒)
  write_timeout: 3        # 写入超时(秒)
  idle_timeout: 300       # 空闲连接超时(秒) - 5分钟
  max_conn_age: 3600      # 连接最大存活时间(秒) - 1小时
  # 性能优化配置
  pool_timeout: 10        # 获取连接超时时间(秒)
  idle_check_frequency: 60 # 空闲连接检查频率(秒)
  max_redirect: 8         # 集群模式最大重定向次数
  read_only: false        # 是否只读模式
  route_by_latency: true  # 按延迟路由(集群模式)
  route_randomly: false   # 随机路由(集群模式)

# JWT配置
jwt:
  secret: ""  # 通过环境变量 JWT_SECRET 注入，必须设置
  expire: "24h"

# 日志配置
log:
  level: info           # 生产环境使用 info 级别
  format: json          # JSON 格式便于日志收集
  output: stdout        # 输出到标准输出，便于容器日志收集
  max_size: 100         # 单个日志文件最大大小(MB)
  max_age: 30           # 日志文件保留天数
  max_backups: 10       # 保留的旧日志文件数量
  compress: true        # 是否压缩旧日志文件

# CORS配置
cors:
  allow_origins: []     # 必须显式配置允许的域名，禁止使用 "*"
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow_headers:
    - Authorization
    - Content-Type
    - X-Request-ID
  allow_credentials: true
  max_age: 86400        # 预检请求缓存时间(秒)

# 文件上传配置
upload:
  max_size: 10MB
  allowed_types:
    - image/jpeg
    - image/png
    - image/gif
    - image/webp
  upload_path: "./uploads"

# 监控配置
metrics:
  enabled: true
  path: /metrics
  
# 限流配置
rate_limit:
  enabled: true
  requests_per_second: 100
  burst: 200

