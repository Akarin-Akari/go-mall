# 综合CI工作流
# 在每次push和pull request时运行所有检查

name: CI

on:
  push:
    branches: [ main, master, aitest, develop ]
  pull_request:
    branches: [ main, master, aitest, develop ]

jobs:
  # 第一步：检查代码质量
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: 'go'
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m
      
      - name: Check formatting
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Go code is not formatted"
            gofmt -s -d .
            exit 1
          fi

  # 第二步：运行测试
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: mall_go_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: 'go'
      
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
        env:
          ENV: test
          DB_DRIVER: mysql
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_NAME: mall_go_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.out

  # 第三步：构建Docker镜像
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: mall-go:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 最后：生成报告
  report:
    name: Generate Report
    runs-on: ubuntu-latest
    if: always()
    needs: [ quality, test, build ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Generate CI report
        run: |
          echo "# CI Report" > ci-report.md
          echo "- Quality: ${{ needs.quality.result }}" >> ci-report.md
          echo "- Tests: ${{ needs.test.result }}" >> ci-report.md
          echo "- Build: ${{ needs.build.result }}" >> ci-report.md
      
      - name: Upload report
        uses: actions/upload-artifact@v3
        with:
          name: ci-report
          path: ci-report.md

