# Docker Compose配置 - SQLite开发环境
# 用于快速本地开发，无需MySQL
# 使用方式: docker-compose -f docker-compose.sqlite.yml up -d

version: '3.8'

services:
  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: mall-go-redis-sqlite
    restart: unless-stopped
    command: redis-server --requirepass redis123456 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data_sqlite:/data
    networks:
      - mall-network-sqlite
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # GoMall应用服务 - SQLite模式
  mall-go:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mall-go-app-sqlite
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ENV: dev
      SERVER_PORT: 8081
      SERVER_MODE: debug
      
      # SQLite数据库配置
      DB_DRIVER: sqlite
      DB_NAME: /app/data/mall_go.db
      
      # Redis配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123456
      REDIS_DB: 0
      REDIS_POOL_SIZE: 200
      REDIS_MIN_IDLE_CONNS: 20
      REDIS_MAX_RETRIES: 5
      REDIS_DIAL_TIMEOUT: 10
      REDIS_READ_TIMEOUT: 5
      REDIS_WRITE_TIMEOUT: 5
      REDIS_IDLE_TIMEOUT: 600
      REDIS_MAX_CONN_AGE: 7200
      
      # JWT配置
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_EXPIRE: 24h
      
      # 日志配置
      LOG_LEVEL: info
      LOG_FORMAT: json
      LOG_OUTPUT: stdout
      
      # CORS配置
      CORS_ALLOW_ORIGINS: "http://localhost:3000,http://localhost:8080"
      CORS_ALLOW_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
      CORS_ALLOW_HEADERS: "Content-Type,Authorization"
    ports:
      - "8081:8081"
    volumes:
      # SQLite数据库文件持久化
      - sqlite_data_sqlite:/app/data
    networks:
      - mall-network-sqlite
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# 网络定义
networks:
  mall-network-sqlite:
    driver: bridge

# 数据卷定义
volumes:
  redis_data_sqlite:
    driver: local
  sqlite_data_sqlite:
    driver: local

